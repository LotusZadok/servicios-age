name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    env:
      # Valores de prueba: solo existen en el Supabase local que levanta este job.
      E2E_ADMIN_EMAIL: admin-ci@agservicios.local
      E2E_ADMIN_PASSWORD: ci-admin-password
      E2E_CLIENT_EMAIL: portal@agservicios.local
      E2E_CLIENT_PASSWORD: changeme123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase test db
      - name: Diagnóstico temporal de privilegios de anon
        if: always()
        run: |
          eval "$(supabase status -o env)"
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -c "select current_user;" -c "
            select p.proname, p.prosecdef as security_definer, pg_get_userbyid(p.proowner) as owner,
                   has_function_privilege('anon', p.oid, 'EXECUTE') as anon_execute, p.proacl
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' order by 1;" -c "
            select c.relname, has_sequence_privilege('anon', c.oid, 'USAGE,SELECT,UPDATE') as anon_any
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'S';" -c "
            select pg_get_userbyid(d.defaclrole) as for_role, coalesce(n.nspname, '(todas)') as schema,
                   d.defaclobjtype as type, d.defaclacl
              from pg_default_acl d left join pg_namespace n on n.oid = d.defaclnamespace order by 1, 2, 3;" -c "
            select has_schema_privilege('anon', 'public', 'USAGE') as anon_usage_public;"
          KEY=${PUBLISHABLE_KEY:-$ANON_KEY}
          for f in is_admin is_staff current_client_id; do
            echo "== rpc $f"
            curl -s -w ' [HTTP %{http_code}]
' -X POST "$API_URL/rest/v1/rpc/$f" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          done
      - name: Generar .env.local desde supabase status
        run: |
          eval "$(supabase status -o env)"
          cat > .env.local <<ENV
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}
          E2E_ADMIN_EMAIL=$E2E_ADMIN_EMAIL
          E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD
          E2E_CLIENT_EMAIL=$E2E_CLIENT_EMAIL
          E2E_CLIENT_PASSWORD=$E2E_CLIENT_PASSWORD
          ENV
      - name: Sembrar datos de prueba
        run: |
          npx tsx scripts/seed-admin.ts "$E2E_ADMIN_EMAIL" "$E2E_ADMIN_PASSWORD" "Admin CI"
          npx tsx scripts/seed-portal-test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=list,html
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
